<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phùng Vũ Hồng Anh</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI", Arial, sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e293b);
color:white;
}

/* MAIN CARD */
.container{
width:90%;
max-width:520px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(18px);
border-radius:22px;
padding:40px;
border:1px solid rgba(255,255,255,0.12);
box-shadow:0 20px 50px rgba(0,0,0,0.45);
text-align:center;
}

/* AVATAR FRAME */
.avatar-frame{
width:130px;
height:130px;
margin:0 auto 20px;
padding:3px;
border-radius:50%;
background:linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.1));
}

.avatar{
width:100%;
height:100%;
border-radius:50%;
object-fit:cover;
background:#111;
}

/* NAME */
.name{
font-size:30px;
font-weight:600;
letter-spacing:0.5px;
margin-bottom:15px;
}

/* INFO */
.info{
opacity:0.85;
line-height:1.6;
font-size:16.5px;
margin-bottom:25px;
}

/* DIVIDER */
.line{
width:100%;
height:1px;
background:rgba(255,255,255,0.15);
margin-bottom:22px;
}

/* MUSIC */
.music-title{
font-size:17px;
margin-bottom:12px;
opacity:0.9;
}

iframe{
width:100%;
height:152px;
border:none;
border-radius:14px;
}

/* MOBILE */
@media(max-width:500px){
.container{
padding:30px;
}
.avatar-frame{
width:110px;
height:110px;
}
.name{
font-size:24px;
}
}
</style>
</head>

<body>

<div class="container">

<!-- AVATAR -->
<div class="avatar-frame">
<img src="images/honganh.jpg" class="avatar">
</div>

<div class="name">Phùng Vũ Hồng Anh</div>

<div class="info">
Sinh nhật: 05/07/2008<br>
Sở thích: Ăn uống, đi chơi, Ozeki Yuto,…
</div>

<div class="line"></div>

<div class="music-title">Bài hát yêu thích</div>

<!-- Spotify -->
<iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/6OWWZtNQORY1McaZmOrwhc?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
  <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/6roVxIZN2frBQoXFomdWW5?utm_source=generator" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>

</div>

</body>
</html>
